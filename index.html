<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大韓貴族學院 | 沉浸式文字互動遊戲 Ver.2.5</title>
    <!-- 引入 Marked.js 用於解析 AI 產出的 Markdown 語法（表格、粗體等） -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-deep: #07080b;
            --bg-panel: #11141c;
            --bg-card: #181d26;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f3e5ab;
            --text-main: #cbd5e1;
            --text-bright: #ffffff;
            --text-muted: #64748b;
            --threat-red: #ef4444;
            --border-color: #262f3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* 頂部導航欄 */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 1.25rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .header-actions button {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .header-actions button:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
        }

        /* 主遊戲容器架構 */
        .game-container {
            display: flex;
            height: calc(100vh - 60px);
            width: 100%;
        }

        /* 左側欄：學生動態檔案區 */
        .sidebar {
            width: 360px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* 右側欄：主核心區（滾動歷史 + 論壇 + 抉擇） */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
            overflow: hidden;
        }

        /* 故事流動區域（保持滾動在最下方） */
        .story-stream {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .story-stream::-webkit-scrollbar {
            width: 6px;
        }
        .story-stream::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* 控制台區塊（論壇與選項固定在底部） */
        .control-panel {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 50%;
            overflow-y: auto;
        }

        /* 樣式與組件 */
        .section-title {
            color: var(--accent-gold);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-left: 3px solid var(--accent-gold);
            padding-left: 8px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* 檔案渲染樣式 */
        .profile-box, .forum-box {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* 讓 Marked.js 生成的表格與 Markdown 符合豪門風格 */
        .profile-box table, .forum-box table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .profile-box th, .profile-box td, .forum-box th, .forum-box td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }
        .profile-box th, .forum-box th {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--accent-gold);
        }
        .profile-box blockquote, .forum-box blockquote {
            border-left: 3px solid var(--accent-gold);
            background: rgba(255,255,255,0.03);
            padding: 10px;
            margin: 10px 0;
            font-style: italic;
        }

        /* 劇情對白框氣氛 */
        .story-block {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            line-height: 1.8;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease-out;
        }
        .story-block p {
            margin-bottom: 12px;
        }
        .story-block strong {
            color: var(--accent-gold);
        }

        /* 論壇展示區 */
        .forum-section-container {
            background: rgba(239, 68, 68, 0.03);
            border: 1px dashed rgba(239, 68, 68, 0.3);
            padding: 15px;
            border-radius: 6px;
        }

        /* 選項按鈕佈局 */
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--accent-gold);
            background-color: rgba(212, 175, 55, 0.05);
            color: var(--text-bright);
            transform: translateX(4px);
        }

        .option-btn strong {
            color: var(--accent-gold);
            margin-right: 8px;
        }

        /* 自由輸入框 */
        .custom-input-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .custom-input-wrapper input {
            flex: 1;
            background-color: var(--bg-deep);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
        }

        .custom-input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .custom-input-wrapper button {
            background-color: var(--accent-gold);
            color: var(--bg-deep);
            border: none;
            padding: 0 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .custom-input-wrapper button:hover {
            background-color: var(--accent-gold-hover);
        }

        /* 彈窗／遮罩層（金鑰輸入與角色創建） */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--bg-panel);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .modal-content h2 {
            color: var(--accent-gold);
            margin-bottom: 16px;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background-color: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-group textarea {
            height: 80px;
            resize: none;
        }

        .modal-btn {
            width: 100%;
            background-color: var(--accent-gold);
            color: var(--bg-deep);
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .modal-btn:hover {
            background-color: var(--accent-gold-hover);
        }

        .hidden { display: none !important; }

        /* 載入動畫 */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: var(--accent-gold);
            font-style: italic;
            padding: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 頂部功能列 -->
    <header>
        <h1>🏛️ 大韓貴族學院 <span style="font-size: 0.75rem; color: var(--text-muted);">Ver.2.5</span></h1>
        <div class="header-actions">
            <button onclick="toggleApiKeyModal()">⚙️ 重設 API Key</button>
            <button onclick="restartGame()" style="margin-left: 8px; border-color: var(--threat-red); color: var(--threat-red);">🔄 重啟遊戲</button>
        </div>
    </header>

    <!-- 主遊戲介面 -->
    <div class="game-container">
        <!-- 左側面板：即時檔案狀態欄 -->
        <aside class="sidebar">
            <div>
                <div class="section-title">📊 學生即時動態檔案</div>
                <div id="profile-container" class="profile-box">
                    <p style="color: var(--text-muted);">等待遊戲開局生成...</p>
                </div>
            </div>
        </aside>

        <!-- 右側面板：故事、論壇、操作 -->
        <main class="main-content">
            <!-- 故事滾動軸區 -->
            <div id="story-stream" class="story-stream">
                <div class="story-block">
                    <p><strong>【系統提示】</strong> 歡迎來到大韓民國前 0.01% 的最高權力育成所。請先填寫角色卡以解鎖封閉式校門...</p>
                </div>
                <!-- 動態載入點 -->
            </div>

            <!-- 下方操作主控台 -->
            <div class="control-panel">
                <!-- 論壇看版區 -->
                <div id="forum-section" class="forum-section-container hidden">
                    <div class="section-title">📱 HeraLink 匿名論壇 • 即時熱搜看板</div>
                    <div id="forum-container" class="forum-box"></div>
                </div>

                <!-- 抉擇選項區 -->
                <div id="choices-section">
                    <div class="section-title">🎯 命運博弈抉擇</div>
                    <div id="options-container" class="options-container">
                        <!-- 動態選項按鈕 -->
                    </div>
                    
                    <!-- 自由輸入輸入欄 (D 選項) -->
                    <div class="custom-input-wrapper id="custom-wrapper" style="margin-top: 12px;">
                        <input type="text" id="custom-choice-input" placeholder="【D】自由輸入您的反擊、心理博弈或解密追蹤手段...">
                        <button onclick="submitCustomChoice()">送出反擊</button>
                    </div>
                </div>

                <!-- API 請求等候狀態 -->
                <div id="loading-indicator" class="loading-spinner hidden">
                    <span>⚡ 正在計算家族利益與社交輿論風向...</span>
                </div>
            </div>
        </main>
    </div>

    <!-- 彈窗 1：API 金鑰輸入 -->
    <div id="api-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>🔑 串接 Gemini 核心 API Key</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; text-align: center;">
                本遊戲完全在您的瀏覽器本地運行。金鑰直接保存在您的瀏覽器快取中，絕不會上傳至任何第三方伺服器，請放心使用。
            </p>
            <div class="form-group">
                <label>請輸入您的 Gemini API Key：</label>
                <input type="password" id="api-key-input" placeholder="AIzaSy...">
            </div>
            <p style="font-size: 0.8rem; color: var(--accent-gold); margin-bottom: 12px;">
                💡 提示：您可以前往 Google AI Studio 免費申請此金鑰。
            </p>
            <button class="modal-btn" onclick="saveApiKey()">儲存並繼續</button>
        </div>
    </div>

    <!-- 彈窗 2：角色創建卡 -->
    <div id="character-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>🎭 建立您的繼承者檔案</h2>
            <div class="form-group">
                <label>姓名：</label>
                <input type="text" id="char-name" placeholder="例如：車恩尚、李信">
            </div>
            <div class="form-group">
                <label>性別：</label>
                <select id="char-gender">
                    <option value="女">女 (對話與敘事將嚴格使用「妳/她」)</option>
                    <option value="男">男 (對話與敘事將嚴格使用「你/他」)</option>
                </select>
            </div>
            <div class="form-group">
                <label>年級與年齡：</label>
                <input type="text" id="char-age" placeholder="例如：高二 / 18歲">
            </div>
            <div class="form-group">
                <label>家族階級 (隱性命運起點)：</label>
                <select id="char-class">
                    <option value="Crown (皇冠) 階級">Crown (皇冠) — 頂級財閥、掌權政要核心繼承人</option>
                    <option value="Noble (貴族) 階級">Noble (貴族) — 大型企業、頂尖法律/醫療世家</option>
                    <option value="Prestige (名望) 階級">Prestige (名望) — 新興資本、知名經紀公司高層</option>
                    <option value="General (平民) 階級">General (平民) — 特招生或特殊關係戶</option>
                </select>
            </div>
            <div class="form-group">
                <label>家族產業與背景描述：</label>
                <textarea id="char-family" placeholder="例如：順洋集團小兒子、承載家族高壓的大韓醫院長子..."></textarea>
            </div>
            <div class="form-group">
                <label>外貌氣質與隱密設定 (選填)：</label>
                <textarea id="char-secret" placeholder="例如：高冷貓系、身為冒牌假千金的祕密..."></textarea>
            </div>
            <div class="form-group">
                <label>期望遇見的明星藝人與偏好風格 (選填)：</label>
                <input type="text" id="char-prefer" placeholder="例如：韓韶禧(同班死敵)、極權政商博弈風">
            </div>
            <button class="modal-btn" onclick="startStoryGame()">踏入權力交界處</button>
        </div>
    </div>

    <!-- 核心遊戲邏輯 JavaScript -->
    <script>
        // 系統核心提示詞 Ver.2.5 (完美對接後台)
        const SYSTEM_INSTRUCTION = `
《韓國貴族學院》沉浸式文字遊戲模板 Ver.2.5 (完整詳細版)
這是一個沉浸式文字互動遊戲，請嚴格扮演遊戲主持人，每次遊戲皆為全新世界線。 

📌 世界觀核心：大韓民國 0.01% 的權力交界處
學校表面是培養菁英的名門學院，實際上卻是上流社會為下一代建立的「權力培養場」。學生的地位、待遇、人際關係、話語權，甚至戀愛與未來，幾乎都與背後家族勢力緊密相連。
「在這裡，分數只是裝飾，背後的家世才是你唯一的准考證。」

📊 隱性階級制度：Crown (皇冠)、Noble (貴族)、Prestige (名望)、General (平民)

📌 世界觀規則：
1. 原創角色規則：本模擬器禁止直接使用現實世界既有角色，除非角色卡中有提及。所有人物皆為獨立生成的個體。
2. 正統韓國社會語境：劇情中的所有日常用語、對話風格、以及職位稱呼（如：理事、本部長、代表、室長、檢察官、議員、常務等）必須完全符合現代大韓民國的政商與上流社會習慣。
3. 代名詞性別嚴格區分：男性必須使用「你 / 他」、女性必須使用「妳 / 她」。絕對嚴禁男女代名詞串用、混用。

⚙️ 核心遊戲系統：
1. 社交輿論載體「HeraLink」：玩家行為會引發論壇熱烈討論（爆料貼文、評論風向）。
2. 名聲與標籤系統：如「完美繼承人」、「危險人物」、「神秘的局外人」、「待宰羔羊」。
3. 「利益與情感」雙軌 NPC 邏輯：NPC行事遵循「家族利益 ≧ 個人情感」。潛台詞充滿韓劇式政商交鋒博弈。讚美通常是捧殺，退讓通常是陷阱。

🤖 AI 敘事與操作規則：
1. 每次回覆劇情不可低於 1000 字，具備極強的電影畫面場景感、刻畫角色的微表情與肢體語言。
2. 嚴禁快餐式戀愛。親密感與信任度必須通過一次次的利益交換緩慢累積。
3. 玩家可發起對特定論壇 ID 的「身份確認/解密」行動，單一代碼最多 3 次嘗試機會。如果失敗，輿論威脅指數飆升 30% 且遭到未知 ID 帶有強烈敵意的抹黑。
4. 【修正案】嚴禁在任何看板透露任何人的匿名 ID 的持有者。

📌 【輸出順序與隔離規範】：為了確保敘事與面板界線清晰，AI 的每次回覆必須嚴格遵循以下順序輸出，並使用分隔線 --- 進行物理隔離：
[ 📋 學生即時動態檔案 ]
(這裡使用 Markdown 表格與條列方式，嚴格遵守你在指令中的格式，包含基本檔案、HeraLink動態、核心NPC關係權力圖、背包與關鍵籌碼)
---
[ 🎬 劇情 ]
(這裡提供高密度、充滿細節的電影片段式劇情敘事。字數務必充沛，充滿韓劇博弈潛台詞)
---
[ 📱 HeraLink 即時熱搜看板 ]
(當產生校園輿論或爆料事件時在此生成發文、實時熱門評論及風向數據。若沒發生則此區段留空，但結構仍要用 --- 隔開)
---
[ 🎯 分歧選項 ]
(在這裡固定提供 A、B、C 三個具備長線利害影響力的選項。不要寫出好壞影響，讓玩家自行承擔政治或情感代價。最後提示玩家可以自由輸入 D)
`;

        let chatHistory = [];
        let isWaitingForAI = false;

        window.onload = function() {
            // 初始化檢查金鑰
            const savedKey = localStorage.getItem('gemini_api_key');
            if (!savedKey) {
                document.getElementById('api-modal').classList.remove('hidden');
            } else {
                checkCharacterState();
            }
        };

        function toggleApiKeyModal() {
            const modal = document.getElementById('api-modal');
            modal.classList.toggle('hidden');
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('api-modal').classList.add('hidden');
                checkCharacterState();
            } else {
                alert('請輸入有效的 API Key');
            }
        }

        function checkCharacterState() {
            // 檢查是否需要創角
            if (chatHistory.length === 0) {
                document.getElementById('character-modal').classList.remove('hidden');
            }
        }

        function restartGame() {
            if (confirm('確定要清除當前進度並重啟一場全新的世界線嗎？')) {
                chatHistory = [];
                document.getElementById('story-stream').innerHTML = `
                    <div class="story-block">
                        <p><strong>【系統提示】</strong> 歷史線已重置。請重新填寫檔案踏入學院...</p>
                    </div>`;
                document.getElementById('profile-container').innerHTML = `<p style="color: var(--text-muted);">等待遊戲開局生成...</p>`;
                document.getElementById('forum-section').classList.add('hidden');
                document.getElementById('options-container').innerHTML = '';
                document.getElementById('character-modal').classList.remove('hidden');
            }
        }

        // 開始遊戲：將創角卡包裝為 First Prompt
        function startStoryGame() {
            const name = document.getElementById('char-name').value.trim();
            const gender = document.getElementById('char-gender').value;
            const age = document.getElementById('char-age').value.trim();
            const charClass = document.getElementById('char-class').value;
            const family = document.getElementById('char-family').value.trim();
            const secret = document.getElementById('char-secret').value.trim();
            const prefer = document.getElementById('char-prefer').value.trim();

            if (!name || !age || !family) {
                alert('請完整填寫姓名、年級與家族背景，這關係到您的權力起點。');
                return;
            }

            const characterCardPrompt = `
【玩家角色卡提交 - 遊戲正式開啟】
這是我的角色設定，請根據此設定開啟第一章首發劇情，並初始化狀態欄與論壇：
- 姓名：${name}
- 性別：${gender} (對白與旁白請嚴格遵守妳/她或你/他的區分)
- 年級年齡：${age}
- 隱性階級：${charClass}
- 家族背景與勢力：${family}
- 外貌氣質與隱密設定：${secret || '無'}
- 明星/風格偏好：${prefer || '無'}

請直接開始第一幕，嚴格按照 1.動態檔案表格 2.劇情 3.HeraLink看板 4.選項 的物理隔離順序輸出。`;

            document.getElementById('character-modal').classList.add('hidden');
            sendPromptToGemini(characterCardPrompt);
        }

        // 核心 API 請求函數
        async function sendPromptToGemini(userPrompt) {
            if (isWaitingForAI) return;
            
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('找不到 API 金鑰，請先進行設定。');
                toggleApiKeyModal();
                return;
            }

            setLoading(true);
            
            // 將玩家的新推進行動加入對話歷史
            chatHistory.push({
                role: "user",
                parts: [{ text: userPrompt }]
            });

            try {
                // 使用 Google Gemini 1.5 Pro 進行高智商博弈與長文本敘事
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chatHistory,
                        systemInstruction: {
                            parts: [{ text: SYSTEM_INSTRUCTION }]
                        },
                        generationConfig: {
                            temperature: 0.75,
                            maxOutputTokens: 8192
                        }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "API 呼叫失敗");
                }

                const aiResponseText = data.candidates[0].content.parts[0].text;
                
                // 將 AI 的回應記錄到歷史中以維持上下文記憶
                chatHistory.push({
                    role: "model",
                    parts: [{ text: aiResponseText }]
                });

                // 解析並更新 UI
                parseAndPopulateUI(aiResponseText);

            } catch (error) {
                console.error(error);
                alert(`⚠️ 系統與上流社交界斷開聯絡: ${error.message}\n請確認您的金鑰是否正確，或嘗試重新送出。`);
                chatHistory.pop(); // 失敗時移除最後一次 user 發言
            } finally {
                setLoading(false);
            }
        }

        // 結構解析器：利用物理隔離符「---」將回覆切分為四大區塊
        function parseAndPopulateUI(rawText) {
            // 以「---」做為主要分割點
            const rawSections = rawText.split(/\n---\n|\n---\s*\n|\s*---\s*/);
            
            let profileMarkdown = "";
            let storyMarkdown = "";
            let forumMarkdown = "";
            let optionsMarkdown = "";

            // 根據關鍵標籤進行精準匹配分配（防範 AI 偶爾錯位）
            rawSections.forEach(section => {
                const cleanSection = section.trim();
                if (cleanSection.includes("學生即時動態檔案") || cleanSection.includes("👤 基本檔案")) {
                    profileMarkdown = cleanSection;
                } else if (cleanSection.includes("🎬 劇情") || cleanSection.includes("當前劇情")) {
                    storyMarkdown = cleanSection;
                } else if (cleanSection.includes("HeraLink 匿名論壇") || cleanSection.includes("🔥 今日即時熱門貼文")) {
                    forumMarkdown = cleanSection;
                } else if (cleanSection.includes("分歧選項") || cleanSection.includes("🎯") || cleanSection.includes("【A】")) {
                    optionsMarkdown = cleanSection;
                }
            });

            // 備用機制：若無明顯關鍵字且剛好分四段，按常規順序處理
            if (!storyMarkdown && rawSections.length >= 3) {
                profileMarkdown = rawSections[0];
                storyMarkdown = rawSections[1];
                if (rawSections.length === 4) {
                    forumMarkdown = rawSections[2];
                    optionsMarkdown = rawSections[3];
                } else {
                    optionsMarkdown = rawSections[2];
                }
            }

            // 1. 更新左側即時檔案
            if (profileMarkdown) {
                // 移除標題，只保留核心表格與狀態
                const cleanProfile = profileMarkdown.replace(/#+.*貴族學院.*/g, "").replace(/\[.*學生即時動態檔案.*\]/g, "").trim();
                document.getElementById('profile-container').innerHTML = marked.parse(cleanProfile);
            }

            // 2. 追加渲染主劇情（保留歷史流動感）
            if (storyMarkdown) {
                const cleanStory = storyMarkdown.replace(/\[.*🎬 劇情.*\]/g, "").replace(/#+.*當前劇情.*/g, "").trim();
                const stream = document.getElementById('story-stream');
                
                // 創建新的故事卡片節點
                const block = document.createElement('div');
                block.className = 'story-block';
                block.innerHTML = marked.parse(cleanStory);
                stream.appendChild(block);
                
                // 平滑滾動到最下方
                setTimeout(() => { stream.scrollTop = stream.scrollHeight; }, 100);
            }

            // 3. 更新論壇看板
            if (forumMarkdown && forumMarkdown.length > 30) {
                const cleanForum = forumMarkdown.replace(/\[.*📱 HeraLink.*\]/g, "").trim();
                document.getElementById('forum-container').innerHTML = marked.parse(cleanForum);
                document.getElementById('forum-section').classList.remove('hidden');
            } else {
                document.getElementById('forum-section').classList.add('hidden');
            }

            // 4. 解析分歧選項為互動按鈕
            if (optionsMarkdown) {
                parseOptionsToButtons(optionsMarkdown);
            }
        }

        // 將選項文字提取並轉為網頁按鈕
        function parseOptionsToButtons(optionsText) {
            const container = document.getElementById('options-container');
            container.innerHTML = ""; // 清空舊按鈕
            
            const lines = optionsText.split('\n');
            let btnCount = 0;

            lines.forEach(line => {
                // 尋找包含 【A】、【B】、【C】格式的行
                const match = line.match(/(【A】|【B】|【C】|A\.|B\.|C\.)\s*(.+)/);
                if (match) {
                    btnCount++;
                    const label = match[1];
                    const text = match[2];
                    
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<strong>${label}</strong> ${text}`;
                    btn.onclick = () => {
                        selectChoice(label, text);
                    };
                    container.appendChild(btn);
                }
            });

            // 若 AI 沒有按照結構產出按鈕行，直接做為純文字渲染作為後備
            if (btnCount === 0) {
                container.innerHTML = marked.parse(optionsText);
            }
        }

        // 玩家點擊選項事件
        function selectChoice(label, text) {
            const fullActionText = `【我選擇了 ${label}：${text}】`;
            
            // 在故事流中即時追加玩家的選擇，強化互動感
            const stream = document.getElementById('story-stream');
            const choiceBlock = document.createElement('div');
            choiceBlock.className = 'story-block';
            choiceBlock.style.borderLeft = '4px solid var(--accent-gold)';
            choiceBlock.style.background = 'rgba(212,175,55,0.02)';
            choiceBlock.innerHTML = `<p style="color: var(--accent-gold); font-weight: bold;">${fullActionText}</p>`;
            stream.appendChild(choiceBlock);
            stream.scrollTop = stream.scrollHeight;

            // 送出給 AI 計算下一個世界線分支
            sendPromptToGemini(fullActionText);
        }

        // 玩家自由輸入事件 (D 選項)
        function submitCustomChoice() {
            const inputEl = document.getElementById('custom-choice-input');
            const customText = inputEl.value.trim();
            if (!customText) return;

            const fullActionText = `【【D】玩家自由決策/反擊行動】：${customText}`;
            inputEl.value = ""; // 清空

            const stream = document.getElementById('story-stream');
            const choiceBlock = document.createElement('div');
            choiceBlock.className = 'story-block';
            choiceBlock.style.borderLeft = '4px solid #fff';
            choiceBlock.innerHTML = `<p style="color: #fff; font-weight: bold;">${fullActionText}</p>`;
            stream.appendChild(choiceBlock);
            stream.scrollTop = stream.scrollHeight;

            sendPromptToGemini(fullActionText);
        }

        // 載入狀態控制
        function setLoading(loading) {
            isWaitingForAI = loading;
            const indicator = document.getElementById('loading-indicator');
            const optionBtns = document.querySelectorAll('.option-btn');
            const customBtn = document.querySelector('.custom-input-wrapper button');
            
            if (loading) {
                indicator.classList.remove('hidden');
                optionBtns.forEach(b => b.disabled = true);
                if(customBtn) customBtn.disabled = true;
            } else {
                indicator.classList.add('hidden');
                optionBtns.forEach(b => b.disabled = false);
                if(customBtn) customBtn.disabled = false;
            }
        }
    </script>
</body>
